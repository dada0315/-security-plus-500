
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security+ 実技問題</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.6}
header{background:#111827;color:white;padding:18px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px}
button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;margin:5px 5px 5px 0}
.action{background:#2563eb;color:white}
.secondary{background:#4b5563;color:white}
textarea{box-sizing:border-box;width:100%;min-height:120px;padding:12px;font-size:16px;border:1px solid #9ca3af;border-radius:8px}
.hidden{display:none}
.answer{background:#dcfce7;padding:12px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h2>🧩 Security+ 実技問題</h2>
<p>追加問題トレーニング</p>
</header>
<main>
<div class="card" id="loading">実技問題を読み込んでいます…</div>
<div class="card hidden" id="quiz">
<p id="progress"></p>
<h3 id="question"></h3>
<div id="instructions"></div>
<div id="problemImage"></div>
<p><strong>あなたの回答</strong></p>
<textarea id="response" placeholder="回答をここに入力してください"></textarea>
<p>
<button class="action" id="showAnswer">解答・解説を確認</button>
<button class="secondary" onclick="location.href='318.html'">問題一覧に戻る</button>
</p>
<div id="answerBox" class="answer hidden"></div>
<p>
<button class="action hidden" id="next">次の実技問題 ▶</button>
</p>
</div>
</main>
<script>
let questions=[],pos=0;
const $=id=>document.getElementById(id);
async function init(){
 try{
  const r=await fetch('questions318_pbq.json');
  if(!r.ok)throw Error('questions318_pbq.json が見つかりません。');
  const data=await r.json();
  if(!Array.isArray(data)||!data.length)throw Error('実技問題データが空です。');
  questions=data;
  $('loading').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  render();
 }catch(e){
  $('loading').textContent='読み込みエラー：'+e.message;
 }
}
function render(){
 const q=questions[pos];
 $('progress').textContent='実技問題 '+(pos+1)+' / '+questions.length;
 $('question').textContent=q.question||'問題文がありません';
 $('instructions').innerHTML='';
 (q.instructions||[]).forEach(t=>{
  const p=document.createElement('p');
  p.textContent='・'+t;
  $('instructions').appendChild(p);
 });
$('problemImage').innerHTML='';
const imageFiles = q.id===76 ? ['q76-033.jpg']
 : q.id===77 ? ['q77-035.jpg','q77-036.jpg','q77-037.jpg','q77-038.jpg','q77-039.jpg']
 : q.id===310 ? ['q310-137.jpg','q310-138.jpg','q310-139.jpg']
 : [];
imageFiles.forEach(src=>{
 const img=document.createElement('img');
 img.src=src;
 img.alt='実技問題 '+q.id+' の参考画像';
 img.style.width='100%';
 img.style.height='auto';
 img.style.margin='12px 0';
 img.style.border='1px solid #ccc';
 img.style.borderRadius='8px';
 $('problemImage').appendChild(img);
});
 $('response').value='';
 $('answerBox').classList.add('hidden');
 $('answerBox').textContent='';
 $('showAnswer').classList.remove('hidden');
 $('next').classList.add('hidden');
 $('next').textContent=pos===questions.length-1?'一覧に戻る':'次の実技問題 ▶';
}
$('showAnswer').onclick=()=>{
 const q=questions[pos];
 $('answerBox').textContent='解答例：\n'+(q.answer||'解答例はありません')+(q.note?'\n\n注意：'+q.note:'');
 $('answerBox').classList.remove('hidden');
 $('showAnswer').classList.add('hidden');
 $('next').classList.remove('hidden');
};
$('next').onclick=()=>{
 if(pos<questions.length-1){pos++;render();}
 else location.href='318.html';
};
init();
</script>
</body>
</html>
